# The tag shown before the player's name above their head and in chat.
# Uses MiniMessage format: https://docs.advntr.dev/minimessage/format.html
# Keep a trailing space so there's a gap before the name.
prefix: "<dark_purple><bold>[LIVE]</bold></dark_purple> "

# The tag shown in the tab list when the TAB plugin is installed
# (uses & colour codes).
tab-prefix: "&5&l[LIVE] &r"

messages:
  enabled: "You are now LIVE - the tag is showing next to your name."
  disabled: "You are no longer LIVE - the tag is hidden."
  no-permission: "You don't have permission to use this."

# Automatically show the tag while a linked streamer is live on Twitch.
# Setup: create an app at https://dev.twitch.tv/console, then paste its
# Client ID and Client Secret below and run /live reload.
twitch:
  enabled: true
  client-id: "dj2w1erlcj8lpupzd2vc86jlq0l428"
  client-secret: "95dpzdcds2a3j51yshkh180f7zycpg"
  # How often to check Twitch (minimum 30).
  check-interval-seconds: 60
  # false = only staff can link accounts (stops people linking someone
  # else's channel to get the tag). true = streamers can use /live link <twitch>.
  allow-self-link: false
  # Broadcast a message in chat when a linked streamer goes live.
  announce: false
  announce-message: "<dark_purple><bold>[LIVE]</bold></dark_purple> <white>%player%</white> <gray>is live on Twitch!</gray> <click:open_url:'https://twitch.tv/%twitch%'><aqua>twitch.tv/%twitch%</aqua></click>"

# Chat mascots: while a linked streamer is live, a TV-head figure stands next to
# them with their own Twitch chat floating above it. Every streamer gets their own
# mascot in their own colour (same skin, different coloured armour + board).
mascot:
  enabled: true
  # true = every linked streamer's mascot is always in the world (even when they are
  # not live on Twitch). false = the mascot only appears while they are live.
  always-visible: true
  # true = a streamer only gets their mascot once they have been live on Twitch at least once.
  require-first-stream: true

  # --- The skin (pick ONE) ---
  # Option 1: copy the skin of an existing Minecraft account (put the TV-head skin
  # on an account and write its name here, max 16 characters).
  skin-name: ""
  # Option 2: a skin texture value (and signature) from mineskin.org.
  skin-texture-value: ""
  skin-texture-signature: ""

  # One coloured skin per streamer colour, in the SAME ORDER as 'colors' below (skin 1 = colour 1...).
  # Upload skin_01_red.png etc. from the skins zip to mineskin.org (classic arms) and paste the
  # texture value + signature. You only need as many as you have streamers - colours are handed
  # out in order, so the first skins get used first. A colour without a skin falls back to the
  # single skin above, or the default look with coloured leather armour.
  # Staff can pick a streamer's colour with /live mascot color <player> <name or number>.
  skins:
    - { color: red, value: "", signature: "" }
    - { color: cyan, value: "", signature: "" }
    - { color: yellow, value: "", signature: "" }
    - { color: violet, value: "", signature: "" }
    - { color: green, value: "", signature: "" }
    - { color: orange, value: "", signature: "" }
    - { color: azure, value: "", signature: "" }
    - { color: magenta, value: "", signature: "" }
    - { color: lime, value: "", signature: "" }
    - { color: blue, value: "", signature: "" }
    - { color: rose, value: "", signature: "" }
    - { color: mint, value: "", signature: "" }
    - { color: deep_red, value: "", signature: "" }
    - { color: deep_cyan, value: "", signature: "" }
    - { color: deep_violet, value: "", signature: "" }
    - { color: deep_green, value: "", signature: "" }
    - { color: deep_orange, value: "", signature: "" }

  # Colours handed out to streamers in order, as hex. Each streamer keeps theirs, and no two
  # streamers share one. Keep this list in the SAME ORDER as 'skins' (colour 1 <-> skin 1).
  colors:
    - "E63232"   # 1 red
    - "32E6E6"   # 2 cyan
    - "E6E632"   # 3 yellow
    - "8C32E6"   # 4 violet
    - "32E632"   # 5 green
    - "E68C32"   # 6 orange
    - "328CE6"   # 7 azure
    - "E632E6"   # 8 magenta
    - "8CE632"   # 9 lime
    - "3232E6"   # 10 blue
    - "E6328C"   # 11 rose
    - "32E68C"   # 12 mint
    - "8C1C1C"   # 13 deep_red
    - "1C8C8C"   # 14 deep_cyan
    - "541C8C"   # 15 deep_violet
    - "1C8C1C"   # 16 deep_green
    - "8C541C"   # 17 deep_orange

  # Show the streamer's Twitch chat on the mascot even when they are offline.
  offline-chat: true
  # Twitch events shown on the mascot's board: subs, resubs, gifted subs, community gifts, raids, cheers.
  events:
    enabled: true
    show-seconds: 40        # how long an event stays on the board
    notify-streamer: true   # also show it above the streamer's hotbar
    broadcast: false        # true = announce every event to the whole server
    cheer-min-bits: 100     # cheers below this many bits are ignored
    jump-seconds: 8         # the mascot jumps on the spot this long for each event (0 = no jumping)
    sounds:                 # the mascot plays these (any Minecraft sound name; empty = silent)
      sub: entity.player.levelup
      resub: entity.player.levelup
      gift: entity.player.levelup
      raid: entity.ender_dragon.growl
      cheer: entity.experience_orb.pickup

  # Words in Twitch chat that make the mascot play a sound (first match wins, whole words only).
  # Use any Minecraft sound name (see the Minecraft wiki "Sounds.json" list), e.g. entity.creeper.primed
  chat-sounds:
    enabled: true
    cooldown-seconds: 300
    volume: 1.0
    pitch: 1.0
    sounds:
      creeper: entity.creeper.primed
      boom: entity.generic.explode
      tnt: entity.generic.explode
      zombie: entity.zombie.ambient
      skeleton: entity.skeleton.ambient
      enderman: entity.enderman.scream
      ghast: entity.ghast.scream
      dragon: entity.ender_dragon.growl
      enderdragon: entity.ender_dragon.growl
      cow: entity.cow.ambient
      pig: entity.pig.ambient
      sheep: entity.sheep.ambient
      chicken: entity.chicken.ambient
      villager: entity.villager.ambient
      hmm: entity.villager.trade
      oof: entity.player.hurt
      gg: entity.player.levelup
      ding: entity.experience_orb.pickup

  max-lines: 5              # messages shown at once
  message-seconds: 25       # how long a message stays
  max-message-length: 70
  side-offset: 1.6          # how far to the streamer's right the mascot stands
  board-scale: 0.6          # size of the chat text above the mascot (1.0 = normal)
  always-show-health: false # false = health bar only while it is hurt
  come-when-live: true      # the mascot jumps to its streamer (and follows again) when the stream starts
  pushable: true            # players can push it by walking into it, and hits knock it back
  name-source: twitch       # twitch = the name above the mascot is the Twitch channel name; minecraft = the in-game name
  teleport-delay-seconds: 1.5 # when it is too far away it charges up for this long (with ender particles) before teleporting (0 = instant)
  follow-distance: 2.5      # how close the mascot walks to you before it stops
  scale: 0.7                # mascot size (1.0 = same as a player)
  inactivity-death-hours: 48 # mascot dies if its streamer hasn't been live this long (0 = off)
  board-height: 3.0         # height of the chat board above the mascot (raise it if the name covers the chat)

  ignore-commands: true     # skip messages starting with !
  ignored-users:            # bots whose messages are hidden
    - nightbot
    - streamelements
    - moobot
    - streamlabs
    - fossabot
  blocked-words: []         # words replaced with ***, e.g. ["badword"]

  # --- Health, death and rebirth ---
  can-be-killed: true
  health: 20                # mascot health (20 = 10 hearts)
  regen-seconds: 10         # heals 1 health this often when it hasn't been hurt
  feed-heal: 4              # health restored by one food item
  drop-armor-on-death: true # armour people put on it drops where it died
  announce-death: true      # tell everyone in chat when it dies
  others-can-feed: true     # anyone can feed it (owner always can)
  others-can-take-armor: false # false = only the owner can take armour off it (sneak + right-click, empty hand)
  others-can-leash: false   # false = only the owner can put a lead on it (anyone holding it can let go)

  # A dead mascot leaves a grave. How it comes back depends on how it died:
  #  - killed by a PLAYER: right-click the grave holding that player's head
  #  - killed by a mob, lava, a fall, fire, an explosion...: right-click it with a
  #    Totem of Undying
  #  - staff can always use /live mascot revive <player>
  revive:
    totem: true             # allow the Totem of Undying for deaths not caused by a player
    # When a player who killed a mascot dies, they drop their own head - so the way to
    # bring the mascot back is to take revenge. Turn off if you hand out heads another way.
    killer-head-drops: true
    announce: true          # tell everyone in chat when it is reborn
