# The tag shown before the player's name above their head and in chat.
# Uses MiniMessage format: https://docs.advntr.dev/minimessage/format.html
# Keep a trailing space so there's a gap before the name.
prefix: "<dark_purple><bold>[LIVE]</bold></dark_purple> "

# The tag shown in the tab list when the TAB plugin is installed
# (uses & colour codes).
tab-prefix: "&5&l[LIVE] &r"

messages:
  enabled: "You are now LIVE - the tag is showing next to your name."
  disabled: "You are no longer LIVE - the tag is hidden."
  no-permission: "You don't have permission to use this."

# Automatically show the tag while a linked streamer is live on Twitch.
# Setup: create an app at https://dev.twitch.tv/console, then paste its
# Client ID and Client Secret below and run /live reload.
twitch:
  enabled: true
  client-id: ""
  client-secret: ""
  # How often to check Twitch (minimum 30).
  check-interval-seconds: 60
  # false = only staff can link accounts (stops people linking someone
  # else's channel to get the tag). true = streamers can use /live link <twitch>.
  allow-self-link: false
  # Broadcast a message in chat when a linked streamer goes live.
  announce: false
  announce-message: "<dark_purple><bold>[LIVE]</bold></dark_purple> <white>%player%</white> <gray>is live on Twitch!</gray> <click:open_url:'https://twitch.tv/%twitch%'><aqua>twitch.tv/%twitch%</aqua></click>"

# Chat mascots: while a linked streamer is live, a TV-head figure stands next to
# them with their own Twitch chat floating above it. Every streamer gets their own
# mascot in their own colour (same skin, different coloured armour + board).
mascot:
  enabled: true
  # true = every linked streamer's mascot is always in the world (even when they are
  # not live on Twitch). false = the mascot only appears while they are live.
  always-visible: true
  # true = a streamer only gets their mascot once they have been live on Twitch at least once.
  require-first-stream: true

  # --- The skin (pick ONE) ---
  # Option 1: copy the skin of an existing Minecraft account (put the TV-head skin
  # on an account and write its name here, max 16 characters).
  skin-name: ""
  # Option 2: a skin texture value (and signature) from mineskin.org.
  skin-texture-value: ""
  skin-texture-signature: ""

  # One coloured skin per streamer colour, in the SAME ORDER as 'colors' below (skin 1 = colour 1...).
  # Upload skin_01_red.png etc. from the skins zip to mineskin.org (classic arms) and paste the
  # texture value + signature. You only need as many as you have streamers - colours are handed
  # out in order, so the first skins get used first. A colour without a skin falls back to the
  # single skin above, or the default look with coloured leather armour.
  # Staff can pick a streamer's colour with /live mascot color <player> <name or number>.
  skins:
    - { color: red, value: "", signature: "" }
    - { color: cyan, value: "", signature: "" }
    - { color: yellow, value: "", signature: "" }
    - { color: violet, value: "", signature: "" }
    - { color: green, value: "", signature: "" }
    - { color: orange, value: "", signature: "" }
    - { color: azure, value: "", signature: "" }
